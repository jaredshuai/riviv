[package]
name = "riviv"
version = "0.1.0"
edition = "2024"
description = "Unofficial Rust rewrite of voidtools/voidImageViewer — a lightweight Windows image viewer"
license = "MIT"
repository = "https://github.com/jaredshuai/riviv"
readme = "README.md"

[dependencies]
# 解码:静态图 + 动画 GIF/WebP 帧(合成后帧 + 帧延迟);关默认 feature 换最小依赖面
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "ico",
    "tiff",
    "gif",
    "webp",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # D2D/D3D/DXGI 视口栈(#80);Direct2D_Common + Dxgi_Common 是
    # CreateBitmap/CreateBitmapFromDxgiSurface 的 cfg 前置
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    # GetDpiForSystem — chrome/对话框四点统一系统 DPI 源(#79;PMv2 manifest 后)
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 嵌入 res/riviv.ico + 版本信息(#26);自带资源对象写出,无外部 rc.exe
winresource = "0.1.31"

[dev-dependencies]
# 测试内合成带 ICC 应用扩展(ICCRGBG1012)的动画 GIF(#77 动画验收);
# 经 image 的 gif feature 已在依赖树里,零新增下载
gif = "0.14"
# 测试内合成 APNG fixture(#98):png 0.18 Encoder 写 acTL/fcTL/IDAT/fdAT
# (set_animated/set_dispose_op/with_info 带 iCCP);经 image 的 png feature
# 已在依赖树里,零新增下载
png = "0.18"

[lints.clippy]
# unsafe 密集 FFI:每个 unsafe 块必须带 SAFETY 注释(AGENTS.md 技术栈约定)
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = true

[package]
name = "riviv"
version = "0.1.0"
edition = "2024"
description = "Unofficial Rust rewrite of voidtools/voidImageViewer — a lightweight Windows image viewer"
license = "MIT"
repository = "https://github.com/jaredshuai/riviv"
readme = "README.md"

[dependencies]
# 解码:静态图 + 动画 GIF/WebP 帧(合成后帧 + 帧延迟);关默认 feature 换最小依赖面
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "ico",
    "tiff",
    "gif",
    "webp",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.clippy]
# unsafe 密集 FFI:每个 unsafe 块必须带 SAFETY 注释(AGENTS.md 技术栈约定)
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = true
